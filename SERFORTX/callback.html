<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SERFORTX — Redirecting</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#07050d;color:#f7f3ff;font-family:Arial,Helvetica,sans-serif}.box{text-align:center}.logo{font-size:30px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#7b35ff,#fff,#9e70ff);-webkit-background-clip:text;color:transparent}p{color:#8e8796;font-size:13px}.dot{display:inline-block;width:7px;height:7px;margin:0 3px;border-radius:50%;background:#a66cff;animation:p 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes p{50%{opacity:.25;transform:translateY(-3px)}}
</style></head>
<body><main class="box"><div class="logo">SERFORTX</div><p>กำลังเข้าสู่ Discord<span class="dot"></span><span class="dot"></span><span class="dot"></span></p></main>
<script>setTimeout(()=>window.location.replace('https://discord.gg/g6EJaGX9n6'),700);</script>
</body></html>
